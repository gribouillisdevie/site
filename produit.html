<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Gribouillis de vie</title>
<script>
  // Ancienne adresse (produit.html?p=...) : renvoie vers la nouvelle page du produit.
  (function(){
    var q=new URLSearchParams(location.search), p=(q.get('p')||'').replace(/[^a-z0-9-]/g,''), f=q.get('f');
    location.replace(p ? p+'.html'+(f?'?f='+encodeURIComponent(f):'') : 'index.html#creations');
  })();
</script>
</head>
<body><p><a href="index.html#creations">Voir toutes les créations</a></p><script src="bulle.js?v=2" defer></script>
</body>
</html>
